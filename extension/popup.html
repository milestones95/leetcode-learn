<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; --muted: #888; --accent: #2f7d4f; }
      body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .row { display: flex; justify-content: space-between; margin: 2px 0; }
      .muted { color: var(--muted); }
      .timer { font-size: 22px; font-variant-numeric: tabular-nums; margin: 6px 0; }
      .buttons { display: flex; gap: 8px; margin-top: 10px; }
      .buttons[hidden] { display: none; }
      .diag { margin-top: 8px; font-size: 12px; }
      .diag .bad { color: #c0392b; }
      button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #8884; cursor: pointer; }
      button.primary { background: var(--accent); color: white; border-color: transparent; }
      #error { color: #c0392b; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Practice session</h1>
    <div id="content" class="muted">Loading…</div>
    <div class="buttons" id="buttons" hidden>
      <button class="primary" id="end">End session</button>
      <button id="giveup">Give up</button>
    </div>
    <div id="diag" class="diag"></div>
    <div id="error"></div>
    <script src="popup.js"></script>
  </body>
</html>
